<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cine Aurora 📽️ - Login</title>
    <meta name="description" content="Cine Aurora - Login" />
    <link rel="icon" href="../assets/favicon/logo-cine.png" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/components/header.css" />
    <link rel="stylesheet" href="../css/components/nav.css" />
    <link rel="stylesheet" href="../css/components/footer.css" />
  </head>

  <body>
    <header>
      <div class="Logo">
        <h1>Cine Aurora</h1>
        <img src="../assets/favicon/logo-cine.png" alt="logo-cine-aurora" />
      </div>
      <div class="Menu">
        <nav>
          <a href="../index.html">Inicio</a>
          <a href="./estrenos.html">Próximos estrenos</a>
          <a href="../index.html">Volver</a>
        </nav>
      </div>
    </header>
    <main class="login-container">
      <form class="login-form" action="perfil.html">
        <h2>Acceso Clientes</h2>
        <div class="form-group">
          <label>Email</label>
          <input class="form-input" type="email" required />
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input class="form-input" type="password" required />
        </div>
        <button class= "login-button" type="submit">Ingresar</button>
        <p class="login-text">
          ¿No eres miembro? <a href="registro.html">Regístrate</a></p>
      </form>
    </main>

    <footer>
      <p>&copy; 2026 Cine Aurora - Todos los derechos reservados</p>
    </footer>
  </body>
</html>
